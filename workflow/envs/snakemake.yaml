# Workhorse environment: read QC/trimming, alignment, dedup, fragment counting,
# and the Python `script:` rules.
#
# Provides: bowtie2 / bowtie2-build, fastp, fastqc, multiqc, samtools, bedtools,
# featureCounts (subread), Picard (MarkDuplicates) + a JRE (FastQC needs Java), and
# python + pandas/numpy for the script: rules (compute_spikein_factors,
# blacklist_stats, consensus_peaks,
# tss_enrichment_score, downsample_tss_matrix, qc_report, diffopen_report).
#
# Curated direct dependencies, pinned by VERSION not build string. Previously a
# 231-package `conda env export` dump carrying the `defaults` channel (restricted
# by Anaconda's terms for many institutional users; Bioconda's guidance is
# conda-forge + bioconda only) and a leaked developer `prefix:` line.
#
# IMPORTANT: the `snakemake=` pin below is read by workflow/Snakefile at load time
# and compared against the driver's version. Rules using `script:` run their Python
# inside THIS environment through a wrapper the driver generates, so a mismatched
# driver breaks every one of them with an empty log file. Keep the README's
# documented driver version in step with this pin.
name: snakemake
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake=9.3.2
  - snakemake-minimal=9.3.2
  - pandas=2.2.3
  - numpy=2.2.5
  - bowtie2=2.5.4
  - samtools=1.21
  - bedtools=2.31.1
  - fastp=0.24.1
  - fastqc=0.12.1
  - multiqc=1.28
  - subread=2.0.8
  - openjdk=23.0.2
  - picard=3.4.0
