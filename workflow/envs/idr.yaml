# IDR (irreproducible discovery rate) for the QC stage's pairwise replicate
# reproducibility analysis.
#
# Curated direct dependencies, pinned by VERSION not build string. Previously a
# 116-package `conda env export` dump carrying the `defaults` channel and a leaked
# developer `prefix:` line. idr 2.0.4.2 requires python 3.6.
name: idr
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.6
  - idr=2.0.4.2
