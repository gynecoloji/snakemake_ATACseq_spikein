# deepTools environment for the QC and signal-track rules.
#
# Provides: bamCoverage, bamPEFragmentSize, computeGCBias, computeMatrix,
# multiBamSummary, plotCorrelation, plotFingerprint, plotHeatmap, plotPCA,
# plotProfile.
#
# CURATED DIRECT DEPENDENCIES ONLY, pinned by VERSION and never by build string.
# The previous version of this file was a full `conda env export` dump: 125
# packages, 123 of them pinned to exact linux-64 build strings. That made the
# environment unsolvable under conda's `strict` channel priority -- which is what
# Bioconda's own documentation tells users to configure --
#
#   Could not solve for environment specs
#     - package munkres-1.0.7-py_1 is excluded by strict repo priority
#
# and unsolvable on macOS at all, despite the README listing MacOS as supported.
# deepTools is required by create_bigwig, create_spikein_bigwig, diffopen_bigwig,
# diffopen_tracks and every rule in the QC stage, so this blocked the workflow at
# environment creation, before any rule ran.
#
# Let the solver resolve the transitive tree (numpy, scipy, matplotlib, pysam,
# py2bit, pyBigWig, deeptoolsintervals all arrive as deepTools dependencies).
name: deeptools
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - deeptools=3.5.6
