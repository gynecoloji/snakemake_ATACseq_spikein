# Interval / alignment utilities for the FRiP, library-complexity, blacklist and
# reads-in-annotation rules. `bc` is used for the shell arithmetic in those rules.
#
# Curated direct dependencies, pinned by VERSION not build string. Previously a
# 46-package `conda env export` dump that also carried the `defaults` channel
# (restricted by Anaconda's terms for many institutional users; Bioconda's guidance
# is conda-forge + bioconda only) and a leaked developer `prefix:` line.
name: bedtools
channels:
  - conda-forge
  - bioconda
dependencies:
  - bedtools=2.31.1
  - samtools=1.21
  - bc
