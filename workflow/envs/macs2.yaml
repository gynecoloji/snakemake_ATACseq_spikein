# MACS2 for peak calling (call_peaks, relaxed_peaks, qc_relaxed_peaks).
#
# Curated direct dependencies, pinned by VERSION not build string. Previously a
# 106-package `conda env export` dump carrying the `defaults` channel and a leaked
# developer `prefix:` line.
#
# NOTE: bioconda's macs2 ships a `#!/usr/bin/env python` shebang, so it resolves
# whichever python is first on PATH. Do not put a foreign environment ahead of this
# one -- see the batch-script warning in the README.
name: macs2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.7
  - macs2=2.2.7.1
